name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/cellular-globe.apk
          ls -lh out

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: cellular-globe-apk
          path: out/cellular-globe.apk
          if-no-files-found: error
          retention-days: 90

      - name: Attach the APK to a release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/cellular-globe.apk
          generate_release_notes: true
