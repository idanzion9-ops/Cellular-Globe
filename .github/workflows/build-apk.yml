name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/cellular-globe.apk
          ls -lh out

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: cellular-globe-apk
          path: out/cellular-globe.apk
          if-no-files-found: error
          retention-days: 90

      # Every push to main refreshes a rolling release, so there is always one
      # permanent download link that is never older than the last commit.
      - name: Refresh the rolling "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest out/cellular-globe.apk \
            --title "Latest build" \
            --prerelease \
            --notes "Built automatically from \`${{ github.sha }}\` on $(date -u '+%Y-%m-%d %H:%M UTC').

          Install this APK once to pick up shell changes. Edits to \`index.html\` reach an
          installed app over the air and do not need a reinstall."

      # Pushing a v-tag still cuts a normal, permanent versioned release.
      - name: Attach the APK to a versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/cellular-globe.apk
          generate_release_notes: true
