<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cellular Globe — Mobile Operator Frequencies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#141A24; --bg2:#1A2230; --panel:#202A3A; --panel2:#26313F;
  --line:#2E3A4E; --line2:#3E4E67;
  --txt:#E8EDF5; --txt2:#9AAAC0; --txt3:#6C7C94;
  --f1:#EFA13C; --f2:#35C4A4; --f3:#5A9BF6; --f4:#A97BF0; --f5:#F0568F;
  --ok:#35C4A4; --warn:#EFA13C; --idle:#7E8CA3; --plan:#5A9BF6; --sunset:#E4667E;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --r:10px;
  --sans:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --disp:"Space Grotesk","IBM Plex Sans",system-ui,sans-serif;
}
:root[data-theme="light"]{
  --bg:#EEF1F6; --bg2:#F6F8FB; --panel:#FFFFFF; --panel2:#F2F5F9;
  --line:#DCE3ED; --line2:#C3CEDE;
  --txt:#141C29; --txt2:#5A6B84; --txt3:#8494AB;
  --f1:#C87614; --f2:#0F8E75; --f3:#2B6FD1; --f4:#7A45C9; --f5:#C92C63;
  --idle:#8494AB;
  --shadow:0 8px 24px rgba(20,32,50,.10);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--txt); font-family:var(--sans);
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--disp); font-weight:600; margin:0; letter-spacing:-.01em}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
a{color:var(--f3)}
.tnum{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--f3); outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- shell ---------- */
.wrap{max-width:1360px;margin:0 auto;padding:0 20px calc(80px + env(safe-area-inset-bottom))}
header.top{
  position:sticky; top:0; z-index:40; background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(12px); border-bottom:1px solid var(--line);
}
.top-in{max-width:1360px;margin:0 auto;padding:12px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-size:19px;letter-spacing:-.02em}
.brand .sub{color:var(--txt3);font-size:12.5px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{
  background:var(--panel); border:1px solid var(--line2); color:var(--txt);
  padding:7px 12px; border-radius:8px; font-size:13.5px; font-weight:500;
  display:inline-flex; align-items:center; gap:7px; transition:background .15s,border-color .15s;
}
.btn:hover{background:var(--panel2); border-color:var(--txt3)}
.btn.p{background:var(--f3); border-color:var(--f3); color:#0B1220; font-weight:600}
.btn.p:hover{filter:brightness(1.08)}
.btn.on{background:var(--f2); border-color:var(--f2); color:#08201A; font-weight:600}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:7px}
.btn.danger{color:var(--sunset);border-color:color-mix(in srgb,var(--sunset) 45%,transparent)}
input[type=text],input[type=number],select,textarea{
  background:var(--bg2); border:1px solid var(--line2); border-radius:8px;
  padding:7px 10px; font-size:14px; width:100%;
}
input::placeholder{color:var(--txt3)}

/* ---------- hero ---------- */
.hero{padding:26px 0 8px; display:grid; grid-template-columns:1fr; gap:18px}
.hero-head{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
.hero-head .ttl{font-family:var(--disp);font-size:clamp(30px,5vw,46px);font-weight:700;letter-spacing:-.03em;line-height:1}
.hero-head .flag{font-size:clamp(30px,5vw,44px);line-height:1}
.meta{display:flex;gap:18px;flex-wrap:wrap;color:var(--txt2);font-size:13px;padding-bottom:4px}
.meta b{color:var(--txt);font-weight:600}

/* spectrum chart */
.chart{
  background:var(--panel); border:1px solid var(--line); border-radius:14px;
  padding:16px 16px 10px; box-shadow:var(--shadow); overflow-x:auto;
}
.chart-inner{min-width:720px}
.seg-head{display:flex;gap:8px;margin-bottom:10px}
.seg-h{flex:0 0 auto;border-bottom:1px solid var(--line2);padding-bottom:6px}
.seg-h .nm{font-family:var(--disp);font-size:12.5px;font-weight:600;color:var(--txt2)}
.seg-h .rg{font-size:11px;color:var(--txt3);font-variant-numeric:tabular-nums}
.lane{display:flex;gap:8px;align-items:stretch;margin-bottom:6px}
.lane-lbl{
  flex:0 0 132px; min-width:132px; font-size:12.5px; font-weight:600; display:flex; align-items:center; gap:7px;
  padding-right:6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.lane-lbl i{width:9px;height:9px;border-radius:2px;flex:0 0 auto;display:block}
.seg{flex:0 0 auto;position:relative;height:26px;border-radius:4px;background:var(--bg2);
     border:1px solid var(--line);}
.blk{position:absolute;top:1px;bottom:1px;border-radius:3px;font-size:9.5px;overflow:hidden;
     display:flex;align-items:center;justify-content:center;color:#0A1018;font-weight:700;
     letter-spacing:.01em;min-width:2px;cursor:default}
.blk.idle{background:transparent!important;border:1.5px dashed currentColor;color:inherit;
  background-image:repeating-linear-gradient(135deg,currentColor 0 1.5px,transparent 1.5px 6px)!important;opacity:.85}
.blk.plan{background:transparent!important;border:1.5px dotted currentColor;opacity:.7}
.chart-foot{display:flex;gap:16px;flex-wrap:wrap;padding-top:8px;border-top:1px solid var(--line);
  margin-top:6px;font-size:11.5px;color:var(--txt2)}
.lg{display:flex;align-items:center;gap:6px}
.lg .sw{width:20px;height:11px;border-radius:3px;display:block}
.lg .sw.idle{background-image:repeating-linear-gradient(135deg,var(--txt2) 0 1.5px,transparent 1.5px 5px);border:1px dashed var(--txt2)}
.lg .sw.plan{border:1px dotted var(--txt2)}

/* ---------- layout ---------- */
.grid{display:grid;grid-template-columns:264px minmax(0,1fr);gap:20px;margin-top:24px;align-items:start}
.rail{position:sticky;top:74px;background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:12px;max-height:calc(100vh - 100px);overflow:auto}
.rail h3{font-size:12px;color:var(--txt3);font-weight:600;margin:2px 0 8px}
.rail .search{margin-bottom:10px}
.clist{display:flex;flex-direction:column;gap:2px}
.citem{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;font-size:14px;
  border:1px solid transparent;background:none;width:100%;text-align:left}
.citem:hover{background:var(--panel2)}
.citem.sel{background:var(--bg2);border-color:var(--line2);font-weight:600}
.citem .fl{font-size:16px}
.citem .ct{margin-left:auto;font-size:11px;color:var(--txt3);font-variant-numeric:tabular-nums}

/* operator card */
.ops{display:flex;flex-direction:column;gap:16px;min-width:0}
.op{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}
.op-head{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);
  flex-wrap:wrap}
.op-mark{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-family:var(--disp);
  font-weight:700;font-size:14px;color:#0A1018;flex:0 0 auto}
.op-name{font-family:var(--disp);font-size:17px;font-weight:600}
.op-sub{font-size:11.5px;color:var(--txt3);font-variant-numeric:tabular-nums}
.techs{display:flex;gap:5px;margin-left:auto;flex-wrap:wrap}
.tb{font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;border:1px solid var(--line2);
  color:var(--txt2);font-family:var(--disp)}
.tb.live{border-color:color-mix(in srgb,var(--ok) 55%,transparent);color:var(--ok);
  background:color-mix(in srgb,var(--ok) 12%,transparent)}
.tb.idleT{border-style:dashed;color:var(--idle)}
.op-body{padding:4px 16px 14px}
.tech-grp{margin-top:14px; overflow-x:auto; -webkit-overflow-scrolling:touch}
.tech-grp>h4{font-size:13px;color:var(--txt2);display:flex;align-items:center;gap:8px;margin-bottom:7px}
.tech-grp>h4 .ln{flex:1;height:1px;background:var(--line)}
.tech-grp>h4 .cnt{font-size:11px;color:var(--txt3);font-weight:500}

table.al{width:100%;min-width:520px;border-collapse:collapse;font-size:13px}
table.al th{font-size:10.5px;font-weight:600;color:var(--txt3);text-align:left;padding:5px 8px;
  border-bottom:1px solid var(--line);white-space:nowrap;font-family:var(--disp)}
table.al td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top;
  font-variant-numeric:tabular-nums}
table.al tr:last-child td{border-bottom:none}
table.al tr.dim td{opacity:.72}
.bandcell{display:flex;flex-direction:column;gap:2px;min-width:112px}
.bandid{font-family:var(--disp);font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:6px}
.bandid i{width:8px;height:8px;border-radius:2px;display:block;flex:0 0 auto}
.bandnm{font-size:11px;color:var(--txt3)}
.chip{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:5px;
  border:1px solid var(--line2);color:var(--txt2);white-space:nowrap}
.st-active{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,transparent);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.st-licensed{color:var(--idle);border-color:var(--line2);border-style:dashed}
.st-planned{color:var(--plan);border-color:color-mix(in srgb,var(--plan) 50%,transparent);border-style:dotted}
.st-refarm{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,transparent)}
.st-sunset{color:var(--sunset);border-color:color-mix(in srgb,var(--sunset) 45%,transparent)}
.ch{font-weight:600}
.chsub{font-size:11px;color:var(--txt3)}
.note{font-size:11.5px;color:var(--txt3);font-style:italic}
.rowact{display:flex;gap:4px;justify-content:flex-end}
.iconbtn{background:none;border:1px solid transparent;border-radius:6px;padding:2px 6px;
  font-size:12px;color:var(--txt3)}
.iconbtn:hover{border-color:var(--line2);color:var(--txt)}

.empty{padding:40px 20px;text-align:center;color:var(--txt2);border:1px dashed var(--line2);
  border-radius:14px}
.empty h3{margin-bottom:6px;font-size:17px;color:var(--txt)}

/* ---------- modal ---------- */
.ovl{position:fixed;inset:0;background:rgba(8,12,20,.6);backdrop-filter:blur(3px);z-index:90;
  display:grid;place-items:center;padding:18px}
.ovl[hidden]{display:none}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:14px;width:min(620px,100%);
  max-height:88vh;overflow:auto;box-shadow:var(--shadow)}
.modal header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:var(--panel)}
.modal header h3{font-size:16px;margin-right:auto}
.modal .body{padding:16px 18px}
.modal footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);
  position:sticky;bottom:0;background:var(--panel)}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.fr.one{grid-template-columns:1fr}
.f label{display:block;font-size:11.5px;color:var(--txt2);margin-bottom:4px;font-weight:500}
.hint{font-size:11.5px;color:var(--txt3);margin-top:5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel);
  border:1px solid var(--line2);padding:10px 16px;border-radius:10px;box-shadow:var(--shadow);z-index:99;
  font-size:13.5px}
.toast[hidden]{display:none}

.filters{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 0}
.fchip{font-size:12.5px;padding:5px 11px;border-radius:20px;border:1px solid var(--line);
  background:transparent;color:var(--txt3);font-weight:500;text-decoration:line-through;
  text-decoration-thickness:1px;opacity:.7}
.fchip:hover{opacity:1}
.fchip.on{background:var(--panel);color:var(--txt);border-color:var(--line2);
  text-decoration:none;opacity:1;font-weight:600}
.srcline{margin-top:10px;font-size:12px;color:var(--txt3)}

@media(max-width:900px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;max-height:none}
  .clist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px}
  table.al{font-size:12.5px}
  table.al th:nth-child(4),table.al td:nth-child(4){display:none}
}
@media(max-width:600px){
  .wrap{padding:0 12px 60px}.top-in{padding:10px 12px;gap:10px}
  .brand .sub{display:none}
  .brand h1{font-size:17px}
  .cmenu-in{padding:12px}
  table.al th:nth-child(3),table.al td:nth-child(3){display:none}
}

/* ---------- country picker in the header ---------- */
.cpick{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line2);
  border-radius:10px;padding:7px 12px;font-size:14px;font-weight:600;max-width:260px;
  overflow:hidden;white-space:nowrap}
.cpick:hover{background:var(--panel2)}
.cpick .fl{font-size:16px;flex:0 0 auto}
.cpick .nm{overflow:hidden;text-overflow:ellipsis}
.cpick .car{color:var(--txt3);font-size:10px;flex:0 0 auto}
.cpick.open{border-color:var(--f3)}
.cmenu{position:absolute;left:0;right:0;top:100%;background:var(--panel);
  border-bottom:1px solid var(--line2);box-shadow:var(--shadow);z-index:45;
  max-height:min(70vh,560px);overflow:auto}
.cmenu[hidden]{display:none}
.cmenu-in{max-width:1360px;margin:0 auto;padding:12px 20px 16px}
.cmenu .search{margin-bottom:10px;position:sticky;top:0;background:var(--panel);padding-bottom:8px}
.clist{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:3px}
.cmenu .hintrow{font-size:11.5px;color:var(--txt3);margin:2px 0 8px}

/* ---------- spectrum map launcher + floating window ---------- */
.launchers{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:2px}
.mapicon{display:inline-flex;align-items:flex-end;gap:2px;height:13px}
.mapicon i{width:3px;border-radius:1px;display:block}
.mapicon i:nth-child(1){height:7px;background:var(--f1)}
.mapicon i:nth-child(2){height:13px;background:var(--f2)}
.mapicon i:nth-child(3){height:5px;background:var(--f3)}
.mapicon i:nth-child(4){height:10px;background:var(--f4)}
.btn.map{padding:8px 14px;font-weight:600}
.fw{position:fixed;inset:0;z-index:80;background:rgba(6,10,16,.62);backdrop-filter:blur(4px);
  display:grid;place-items:center;padding:14px}
.fw[hidden]{display:none}
.fw-box{background:var(--panel);border:1px solid var(--line2);border-radius:16px;
  width:min(1260px,100%);max-width:100%;min-width:0;max-height:90vh;
  display:flex;flex-direction:column;box-shadow:var(--shadow);overflow:hidden}
.fw-box>header{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.fw-box>header h3{font-size:15px;margin-right:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fw-body{padding:14px;overflow:auto;min-height:0;min-width:0}
.fw-body .chart{border:none;background:none;padding:0;box-shadow:none}
@media(max-width:700px){
  .fw{padding:6px}
  .fw-box{max-height:95vh;border-radius:12px}
  .fw-body{padding:10px}
}

/* ---------- operators now use the full width ---------- */
.grid{display:block}
.ops{margin-top:22px}

/* ---------- update banner ---------- */
.ubar{display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--f2) 14%,var(--panel));
  border:1px solid color-mix(in srgb,var(--f2) 45%,transparent);border-radius:10px;
  padding:9px 13px;margin-top:14px;font-size:13.5px}
.ubar[hidden]{display:none}
.ubar b{font-weight:600}

</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1>Cellular Globe</h1>
      <span class="sub">Mobile operator frequencies &amp; channel numbers</span>
    </div>
    <button class="cpick" id="cpick" aria-haspopup="listbox" aria-expanded="false">
      <span class="fl" id="cpickFlag">🌍</span><span class="nm" id="cpickName">—</span><span class="car">▾</span>
    </button>
    <div class="tools">
      <button class="btn sm" id="btnUpdate" hidden title="Pull the latest version from GitHub">Check for updates</button>
      <button class="btn sm" id="btnTheme" title="Switch light / dark">◐ Theme</button>
      <button class="btn sm" id="btnImport">Import JSON</button>
      <button class="btn sm" id="btnExport">Export JSON</button>
      <button class="btn sm danger" id="btnReset">Reset data</button>
      <button class="btn" id="btnEdit">Edit mode: off</button>
    </div>
  </div>
  <div class="cmenu" id="cmenu" hidden>
    <div class="cmenu-in">
      <div class="search"><input type="text" id="q" placeholder="Search a country, code or operator…"></div>
      <div class="hintrow" id="qhint"></div>
      <div class="clist" id="clist"></div>
      <div style="margin-top:12px" class="editonly" hidden>
        <button class="btn sm" id="btnAddCountry">+ Add a country</button>
      </div>
    </div>
  </div>
</header>

<div class="wrap">
  <section class="hero">
    <div class="hero-head">
      <span class="flag" id="hFlag">🌍</span>
      <div>
        <div class="ttl" id="hName">—</div>
        <div class="meta" id="hMeta"></div>
      </div>
      <div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap" id="hActions"></div>
    </div>
    <div class="launchers">
      <button class="btn map" id="btnMap">
        <span class="mapicon" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        Spectrum map
      </button>
      <span class="srcline" id="srcline"></span>
    </div>
    <div class="ubar" id="ubar" hidden>
      <span id="ubarText"></span>
      <button class="btn sm" id="ubarBtn" style="margin-left:auto">Reload now</button>
    </div>
  </section>

  <div class="filters" id="filters"></div>
  <main class="ops" id="ops"></main>
</div>

<div class="fw" id="chartWin" hidden>
  <div class="fw-box">
    <header>
      <span class="mapicon" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <h3>Spectrum map · <span id="fwName"></span></h3>
      <button class="btn sm" id="fwClose">Close</button>
    </header>
    <div class="fw-body"><div class="chart"><div class="chart-inner" id="chart"></div></div></div>
  </div>
</div>

<div class="ovl" id="ovl" hidden><div class="modal" id="modal"></div></div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="fileIn" accept="application/json" hidden>

<script>
/* ============================================================
   3GPP BAND REGISTRY
   dl / ul  = band edges in MHz (for TDD, ul === dl)
   ea       = [EARFCN offset DL, EARFCN offset UL]  (TS 36.101)
   ua       = UARFCN frequency offset in MHz        (TS 25.101)
   nr       = 5G NR band label if the band exists in NR (TS 38.104)
   ============================================================ */
const BAND = {
  B1 :{nm:"2100 IMT",       dup:"FDD", dl:[2110,2170], ul:[1920,1980], ea:[0,18000],       ua:0,    nr:"n1"},
  B2 :{nm:"1900 PCS",       dup:"FDD", dl:[1930,1990], ul:[1850,1910], ea:[600,18600],     ua:0,    nr:"n2"},
  B3 :{nm:"1800 DCS",       dup:"FDD", dl:[1805,1880], ul:[1710,1785], ea:[1200,19200],    ua:1575, nr:"n3"},
  B4 :{nm:"1700/2100 AWS-1",dup:"FDD", dl:[2110,2155], ul:[1710,1755], ea:[1950,19950],    ua:1805, nr:null},
  B5 :{nm:"850 CLR",        dup:"FDD", dl:[869,894],   ul:[824,849],   ea:[2400,20400],    ua:0,    nr:"n5"},
  B7 :{nm:"2600 IMT-E",     dup:"FDD", dl:[2620,2690], ul:[2500,2570], ea:[2750,20750],    ua:2175, nr:"n7"},
  B8 :{nm:"900 E-GSM",      dup:"FDD", dl:[925,960],   ul:[880,915],   ea:[3450,21450],    ua:340,  nr:"n8"},

const NR2B = {};
Object.keys(BAND).forEach(k=>{ if(BAND[k].nr && !BAND[BAND[k].nr]) NR2B[BAND[k].nr]=k; });
function canonBand(b){ return BAND[b] ? b : (NR2B[b] || b); }

const TECHS = ["GSM","UMTS","LTE","NR"];
const TECH_LABEL = {GSM:"2G · GSM / GPRS / EDGE", UMTS:"3G · UMTS / HSPA+", LTE:"4G · LTE / LTE-A", NR:"5G · NR"};
const STATUS = {
  active  :{l:"In service",        d:"Deployed and carrying live traffic"},
  refarm  :{l:"Refarming",         d:"Being re-allocated to a newer technology"},
  licensed:{l:"Held, not deployed",d:"Licensed to the operator but no live carrier"},
  planned :{l:"Planned",           d:"Awarded or announced, launch pending"},
  sunset  :{l:"Shutting down",     d:"Legacy carrier scheduled for switch-off"},
  retired :{l:"Switched off",      d:"Licence surrendered or the carrier has already been turned off"}
};

/* colour keyed to position in the spectrum, not to brand */
function freqColor(mhz){
  if(mhz < 1000)  return "var(--f1)";
  if(mhz < 2300)  return "var(--f2)";
  if(mhz < 3300)  return "var(--f3)";
  if(mhz < 7125)  return "var(--f4)";
  return "var(--f5)";
}

/* ---------- absolute channel-number maths ---------- */
const r1 = v => Math.round(v*10)/10;

function gsmArfcn(ulMHz){
  const f = ulMHz;
  const cl = (n,lo,hi) => Math.min(Math.max(n,lo),hi);   // keep band-edge blocks on real channels
  if(f>=890 && f<=915)   return cl(Math.round((f-890)/0.2), 1, 124);          // P-GSM 900
  if(f>=880 && f<890)    return cl(1024 + Math.round((f-890)/0.2), 975, 1023);// E-GSM 900
  if(f>=1710 && f<=1785) return cl(512 + Math.round((f-1710.2)/0.2), 512, 885);  // DCS 1800
  if(f>=824 && f<=849)   return cl(128 + Math.round((f-824.2)/0.2), 128, 251);   // GSM 850
  if(f>=1850 && f<=1910) return cl(512 + Math.round((f-1850.2)/0.2), 512, 810);  // PCS 1900
  return null;
}
function uarfcn(band, mhz){
  band = canonBand(band); const b = BAND[band]; if(!b || b.ua===null || b.ua===undefined) return null;
  return Math.round(5*(mhz - b.ua));
}
function earfcn(band, mhz, dir){
  band = canonBand(band); const b = BAND[band]; if(!b || !b.ea) return null;
  const off = dir==="ul" ? b.ea[1] : b.ea[0];
  if(off===null||off===undefined) return null;
  const low = dir==="ul" ? b.ul[0] : b.dl[0];
  return Math.round(off + 10*(mhz - low));
}
function nrarfcn(mhz){
  const kHz = mhz*1000;
  if(mhz < 3000)   return Math.round(kHz/5);
  if(mhz < 24250)  return Math.round(600000 + (kHz-3000000)/15);
  return Math.round(2016667 + (kHz-24250080)/60);
}
/* channel numbers for one allocation block, per technology */
function channels(tech, band, lo, hi, dir){
  band = canonBand(band); const b = BAND[band]; if(!b) return null;
  let l=lo, h=hi;
  if(dir==="ul" && b.dup==="FDD"){ const gap=b.dl[0]-b.ul[0]; l=lo-gap; h=hi-gap; }
  const c = (l+h)/2;
  if(tech==="GSM"){
    const a1=gsmArfcn(dir==="ul"?l:l-(b.dl[0]-b.ul[0])), a2=gsmArfcn(dir==="ul"?h:h-(b.dl[0]-b.ul[0]));
    if(a1===null) return null;
    return {label:"ARFCN", lo:Math.min(a1,a2), hi:Math.max(a1,a2), c:null, fLo:r1(l), fHi:r1(h), fC:r1(c)};
  }
  if(tech==="UMTS"){
    const u=uarfcn(band,c); if(u===null) return null;
    return {label:"UARFCN", lo:uarfcn(band,l+2.5), hi:uarfcn(band,h-2.5), c:u, fLo:r1(l), fHi:r1(h), fC:r1(c)};
  }
  if(tech==="LTE"){
    const e=earfcn(band,c,dir); if(e===null) return null;
    return {label:"EARFCN", lo:earfcn(band,l,dir), hi:earfcn(band,h,dir), c:e, fLo:r1(l), fHi:r1(h), fC:r1(c)};
  }
  if(tech==="NR"){
    return {label:"NR-ARFCN", lo:nrarfcn(l), hi:nrarfcn(h), c:nrarfcn(c), fLo:r1(l), fHi:r1(h), fC:r1(c)};
  }
  return null;
}
function bandLabel(tech, band){
  band = canonBand(band); const b=BAND[band]; if(!b) return band;
  if(tech==="NR") return b.nr || band;
  if(tech==="UMTS"){
    const rom={B1:"I",B2:"II",B3:"III",B4:"IV",B5:"V",B7:"VII",B8:"VIII",B11:"XI",B19:"XIX",B34:"a",B39:"f"};
    return rom[band] ? "Band "+rom[band] : band;
  }
  if(tech==="GSM"){
    const g={B8:"GSM 900",B3:"GSM 1800",B5:"GSM 850",B2:"GSM 1900",B25:"GSM 1900"};
    return g[band] || band;
  }
  return band;
}

{"id": "EC", "name": "Ecuador", "flag": "🇪🇨", "iso3": "ECU", "mcc": "740", "note": "Three networks, one of them state-owned. 5G assignments were made from 2023 onward without a full competitive auction.", "operators": [{"n": "Claro Ecuador", "mnc": "740-01", "note": "Conecel. Largest network.", "al": [["GSM", "B5", 869, 880, "sunset"], ["UMTS", "B5", 869, 880, "sunset"], ["LTE", "B5", 869, 880, "active"], ["LTE", "B2", 1930, 1955, "active"], ["LTE", "B4", 2110, 2130, "active"], ["LTE", "B7", 2620, 2650, "active"], ["NR", "n78", 3400, 3500, "active", "100 MHz"], ["NR", "n28", 758, 768, "planned"]]}, {"n": "Movistar Ecuador", "mnc": "740-00", "note": "Otecel / Telefonica.", "al": [["GSM", "B5", 880, 890, "sunset"], ["UMTS", "B5", 880, 890, "sunset"], ["LTE", "B5", 880, 890, "active"], ["LTE", "B2", 1955, 1975, "active"], ["LTE", "B4", 2130, 2150, "active"], ["LTE", "B7", 2650, 2670, "active"], ["NR", "n78", 3500, 3600, "active", "100 MHz"]]}, {"n": "CNT", "mnc": "740-02", "note": "State-owned Corporacion Nacional de Telecomunicaciones.", "al": [["UMTS", "B2", 1975, 1990, "sunset"], ["LTE", "B2", 1975, 1990, "active"], ["LTE", "B66", 2155, 2175, "active", "AWS-3"], ["LTE", "B7", 2670, 2690, "active"], ["NR", "n78", 3600, 3700, "licensed", "Held, deployment limited"]]}]},

{"id": "JM", "name": "Jamaica", "flag": "🇯🇲", "iso3": "JAM", "mcc": "338", "note": "A two-network market on the Americas band plan. Digicel launched 5G in late 2023; Flow followed more slowly. Block edges here are the least certain in this dataset.", "operators": [{"n": "Digicel Jamaica", "mnc": "338-050", "note": "Home market of the Digicel group.", "al": [["GSM", "B2", 1930, 1945, "sunset"], ["UMTS", "B2", 1930, 1945, "sunset"], ["UMTS", "B5", 869, 879, "sunset"], ["LTE", "B2", 1945, 1975, "active"], ["LTE", "B4", 2110, 2135, "active"], ["LTE", "B5", 869, 879, "active"], ["LTE", "B17", 734, 740, "active"], ["NR", "n78", 3500, 3600, "active", "Launched late 2023"], ["NR", "n5", 869, 879, "licensed", "Held, no NR carrier"]]}, {"n": "Flow Jamaica", "mnc": "338-020", "note": "Cable & Wireless / Liberty Latin America.", "al": [["GSM", "B2", 1975, 1985, "sunset"], ["UMTS", "B2", 1975, 1990, "sunset"], ["LTE", "B2", 1975, 1990, "active"], ["LTE", "B4", 2135, 2155, "active"], ["LTE", "B5", 879, 889, "active"], ["LTE", "B17", 740, 746, "active"], ["NR", "n78", 3600, 3700, "planned", "Licensed, rollout still limited"]]}]}
]};

</script>
<script>
/* ============================================================
   STATE
   ============================================================ */
const KEY = "spectrum-atlas-v5";
let DATA, sel = 0, edit = false, q = "";
let fTech = new Set(TECHS), fStat = new Set(Object.keys(STATUS));

function normalize(d){
  (d.countries||[]).forEach(c=>{ c.operators=c.operators||[];
    c.operators.forEach(o=>{ o.al=(o.al||[]).map(a=>{ a[1]=canonBand(a[1]); return a; }); }); });
  return d;
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const d = JSON.parse(raw); if(d && Array.isArray(d.countries)) return normalize(d); }
  }catch(e){}
  return normalize(JSON.parse(JSON.stringify(SEED)));
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(DATA)); }
  catch(e){ toast("Changes are kept for this session only — storage is unavailable here."); }
}
const $ = s => document.querySelector(s);
const el = (t,c,h)=>{const n=document.createElement(t); if(c)n.className=c; if(h!==undefined)n.innerHTML=h; return n;};
const esc = s => String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
let toastT;
function toast(m){ const t=$("#toast"); t.textContent=m; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,3200); }

/* stable colour for the operator mark, derived from the name */
function opHue(n){ let h=0; for(const c of n) h=(h*31+c.charCodeAt(0))%360; return h; }

/* ============================================================
   DERIVED HELPERS
   ============================================================ */
function ulBlock(band, lo, hi){
  band = canonBand(band); const b = BAND[band]; if(!b) return null;
  if(b.dup!=="FDD") return null;
  const gap = b.dl[0]-b.ul[0];
  return [r1(Math.max(lo-gap, b.ul[0])), r1(Math.min(hi-gap, b.ul[1]))];
}
function allocMatches(a){ return fTech.has(a[0]) && fStat.has(a[4]); }
function isLive(s){ return s==="active"||s==="refarm"; }

function opTechSummary(op){
  const m = {};
  op.al.forEach(a=>{ const t=a[0]; if(!m[t]) m[t]={live:false,any:false}; m[t].any=true; if(isLive(a[4])) m[t].live=true; });
  return TECHS.filter(t=>m[t]).map(t=>({t, live:m[t].live}));
}

/* ============================================================
   SPECTRUM CHART
   ============================================================ */
const SEGMENTS = [
  {lo:600,  hi:1000,  nm:"Low band",     w:400},
  {lo:1400, hi:1530,  nm:"L-band",       w:150},
  {lo:1690, hi:2200,  nm:"Core mid band",w:510},
  {lo:2300, hi:2700,  nm:"Upper mid",    w:400},
  {lo:3300, hi:4200,  nm:"C-band",       w:560},
  {lo:4400, hi:5000,  nm:"4.7 GHz",      w:180},
  {lo:5150, hi:5925,  nm:"5 GHz U-NII",  w:150},
  {lo:24250,hi:29500, nm:"26/28 GHz",    w:220},
  {lo:37000,hi:43500, nm:"39 GHz",       w:170}
];

function renderChart(c){
  const host = $("#chart"); host.innerHTML = "";
  const blocks = [];
  c.operators.forEach((op,oi)=>{
    op.al.forEach(a=>{
      if(!allocMatches(a)) return;
      blocks.push({oi, lo:a[2], hi:a[3], t:a[0], band:a[1], st:a[4], dir:"DL"});
      const u = ulBlock(a[1], a[2], a[3]);
      if(u) blocks.push({oi, lo:u[0], hi:u[1], t:a[0], band:a[1], st:a[4], dir:"UL"});
    });
  });
  const segs = SEGMENTS.filter(s => blocks.some(b => b.hi>s.lo && b.lo<s.hi));
  if(!segs.length){
    host.appendChild(el("div","empty","<h3>Nothing to plot</h3><p>No allocations match the current filters.</p>"));
    return;
  }
  const inner = el("div"); inner.style.minWidth = (150 + segs.length*92) + "px";
  const flexOf = s => `${(s.w/100).toFixed(2)} 1 0`;

  const head = el("div","seg-head");
  head.appendChild(Object.assign(el("div"),{style:"flex:0 0 132px;min-width:132px"}));
  segs.forEach(s=>{
    const h = el("div","seg-h"); h.style.flex = flexOf(s); h.style.minWidth = "84px";
    h.innerHTML = `<div class="nm">${s.nm}</div><div class="rg">${fmtF(s.lo)} – ${fmtF(s.hi)}</div>`;
    head.appendChild(h);
  });
  inner.appendChild(head);

  c.operators.forEach((op,oi)=>{
    const mine = blocks.filter(b=>b.oi===oi);
    if(!mine.length) return;
    const lane = el("div","lane");
    const lbl = el("div","lane-lbl");
    lbl.innerHTML = `<i style="background:hsl(${opHue(op.n)} 62% 58%)"></i><span>${esc(op.n)}</span>`;
    lane.appendChild(lbl);
    segs.forEach(s=>{
      const sd = el("div","seg"); sd.style.flex = flexOf(s); sd.style.minWidth = "84px";
      mine.filter(b=>b.hi>s.lo && b.lo<s.hi).forEach(b=>{
        const lo = Math.max(b.lo, s.lo), hi = Math.min(b.hi, s.hi);
        const L = (lo-s.lo)/(s.hi-s.lo)*100, W = (hi-lo)/(s.hi-s.lo)*100;
        const col = freqColor((lo+hi)/2);
        const d = el("div","blk");
        d.style.left = L+"%"; d.style.width = Math.max(W,0.5)+"%";
        if(b.st==="planned"){ d.classList.add("plan"); d.style.color=col; }
        else if(b.st==="licensed"||b.st==="sunset"||b.st==="retired"){ d.classList.add("idle"); d.style.color=col; }
        else { d.style.background = col; }
        if(W > 11) d.textContent = bandLabel(b.t, b.band);
        d.title = `${op.n} · ${b.t} ${bandLabel(b.t,b.band)} · ${b.dir} ${fmtF(lo)}–${fmtF(hi)} · ${STATUS[b.st]?.l||b.st}`;
        sd.appendChild(d);
      });
      lane.appendChild(sd);
    });
    inner.appendChild(lane);
  });

  const foot = el("div","chart-foot");
  foot.innerHTML = `
    <span class="lg"><span class="sw" style="background:var(--f1)"></span>&lt; 1 GHz</span>
    <span class="lg"><span class="sw" style="background:var(--f2)"></span>1 – 2.3 GHz</span>
    <span class="lg"><span class="sw" style="background:var(--f3)"></span>2.3 – 3.3 GHz</span>
    <span class="lg"><span class="sw" style="background:var(--f4)"></span>3.3 – 7 GHz</span>
    <span class="lg"><span class="sw" style="background:var(--f5)"></span>mmWave</span>
    <span class="lg" style="margin-left:auto"><span class="sw" style="background:var(--txt2)"></span>In service</span>
    <span class="lg"><span class="sw idle"></span>Held or switched off</span>
    <span class="lg"><span class="sw plan"></span>Planned</span>`;
  inner.appendChild(foot);
  host.appendChild(inner);
}
function fmtF(m){ return m>=1000 ? (m/1000).toFixed(m%1000?2:1).replace(/\.0$/,"")+" GHz" : m+" MHz"; }

/* ============================================================
   OPERATOR CARDS
   ============================================================ */
function renderOps(c){
  const host = $("#ops"); host.innerHTML = "";
  const ops = c.operators;
  if(!ops.length){
    const e0 = el("div","empty", `<h3>${esc(c.name)} is empty</h3>
         <p>Let Claude search the web for its operators and spectrum, or add them by hand.</p>
         <div style="display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap">
           <button class="btn p" data-a="lookup">Auto-fill from the web</button>
           <button class="btn" data-a="addop">Add an operator</button></div>`);
    host.appendChild(e0);
    return;
  }
  ops.forEach(op=>{
    const oi = c.operators.indexOf(op);
    const card = el("div","op");
    const head = el("div","op-head");
    const hue = opHue(op.n);
    head.innerHTML = `
      <div class="op-mark" style="background:hsl(${hue} 62% 58%)">${esc(op.n.slice(0,2).toUpperCase())}</div>
      <div><div class="op-name">${esc(op.n)}</div>
        <div class="op-sub">${esc(op.mnc||"—")}${op.note?" · "+esc(op.note):""}</div></div>
      <div class="techs">${opTechSummary(op).map(x=>
        `<span class="tb ${x.live?"live":"idleT"}" title="${x.live?"Carriers on air":"Spectrum held, nothing on air"}">${x.t==="NR"?"5G NR":x.t==="LTE"?"4G LTE":x.t==="UMTS"?"3G UMTS":"2G GSM"}</span>`).join("")}</div>`;
    if(edit){
      const ea = el("div","rowact");
      ea.innerHTML = `<button class="btn sm" data-a="editop" data-o="${oi}">Edit</button>
                      <button class="btn sm" data-a="addal" data-o="${oi}">+ Band</button>
                      <button class="btn sm danger" data-a="delop" data-o="${oi}">Delete</button>`;
      ea.style.width="100%"; ea.style.justifyContent="flex-start";
      head.appendChild(ea);
    }
    card.appendChild(head);

    const body = el("div","op-body");
    let shown = 0;
    TECHS.forEach(t=>{
      const rows = op.al.map((a,i)=>({a,i})).filter(x=>x.a[0]===t && allocMatches(x.a));
      if(!rows.length) return;
      shown += rows.length;
      const g = el("div","tech-grp");
      const live = rows.filter(x=>isLive(x.a[4])).length;
      g.appendChild(el("h4",null,`<span>${TECH_LABEL[t]}</span><span class="ln"></span>
        <span class="cnt">${rows.length} block${rows.length>1?"s":""} · ${live} on air</span>`));
      const tb = el("table","al");
      tb.innerHTML = `<thead><tr>
        <th>Band</th><th>Downlink block</th><th>Uplink block</th><th>BW</th>
        <th>Downlink channel</th><th>Uplink channel</th><th>Status</th>${edit?"<th></th>":""}
      </tr></thead>`;
      const tbody = el("tbody");
      rows.forEach(({a,i})=>{
        const [tech,band,lo,hi,st,note] = a;
        const b = BAND[canonBand(band)] || {};
        const dl = channels(tech,band,lo,hi,"dl");
        const ul = b.dup==="FDD" ? channels(tech,band,lo,hi,"ul") : null;
        const ub = ulBlock(band,lo,hi);
        const col = freqColor((lo+hi)/2);
        const tr = el("tr", isLive(st)?"":"dim");
        tr.innerHTML = `
          <td><div class="bandcell">
              <span class="bandid"><i style="background:${col}"></i>${esc(bandLabel(tech,band))}</span>
              <span class="bandnm">${esc(b.nm||"")} · ${b.dup||""}</span>
            </div></td>
          <td><span class="ch">${lo}–${hi}</span> <span class="chsub">MHz</span><br>
              <span class="chsub">centre ${dl?dl.fC:"—"} MHz</span></td>
          <td>${ub?`<span class="ch">${ub[0]}–${ub[1]}</span> <span class="chsub">MHz</span><br>
              <span class="chsub">centre ${ul?ul.fC:"—"} MHz</span>`
             :`<span class="chsub">${b.dup==="TDD"?"same block (TDD)":b.dup==="SDL"?"downlink only":"—"}</span>`}</td>
          <td><span class="ch">${r1(hi-lo)}</span> <span class="chsub">MHz</span></td>
          <td>${chCell(dl)}</td>
          <td>${b.dup==="FDD"?chCell(ul):`<span class="chsub">${b.dup==="TDD"?"same as DL":"—"}</span>`}</td>
          <td><span class="chip st-${st}" title="${esc(STATUS[st]?.d||"")}">${esc(STATUS[st]?.l||st)}</span>
              ${note?`<div class="note">${esc(note)}</div>`:""}</td>
          ${edit?`<td><div class="rowact">
              <button class="iconbtn" data-a="edital" data-o="${oi}" data-i="${i}" title="Edit">✎</button>
              <button class="iconbtn" data-a="delal" data-o="${oi}" data-i="${i}" title="Delete">✕</button></div></td>`:""}`;
        tbody.appendChild(tr);
      });
      tb.appendChild(tbody); g.appendChild(tb); body.appendChild(g);
    });
    if(!shown) body.appendChild(el("div","note","No blocks match the current filters."));
    card.appendChild(body);
    host.appendChild(card);
  });
}
function chCell(x){
  if(!x) return `<span class="chsub">not defined for this band</span>`;
  const c = x.c!==null && x.c!==undefined ? `<span class="ch">${x.c}</span>` : `<span class="ch">${x.lo}–${x.hi}</span>`;
  const sub = x.c!==null && x.c!==undefined ? `${x.label} ${x.lo}–${x.hi}` : `${x.label} range`;
  return `${c}<br><span class="chsub">${sub}</span>`;
}

/* ============================================================
   SHELL RENDER
   ============================================================ */
function renderList(){
  const host = $("#clist"); host.innerHTML="";
  const ql = q.trim().toLowerCase();
  let shown = 0;
  DATA.countries.forEach((c,i)=>{
    const hit = !ql || c.name.toLowerCase().includes(ql) || (c.id||"").toLowerCase().includes(ql)
      || c.operators.some(o=>o.n.toLowerCase().includes(ql));
    if(!hit) return;
    const b = el("button","citem"+(i===sel?" sel":""));
    b.innerHTML = `<span class="fl">${c.flag||"🏳"}</span><span>${esc(c.name)}</span>
                   <span class="ct">${c.operators.length}</span>`;
    b.onclick = ()=>{ sel=i; closeCMenu(); render(); window.scrollTo({top:0,behavior:"smooth"}); };
    host.appendChild(b);
    shown++;
  });
  $("#qhint").textContent = ql
    ? `${shown} of ${DATA.countries.length} countries match "${q.trim()}"`
    : `${DATA.countries.length} countries`;
}

/* ---------- header dropdown ---------- */
function openCMenu(){
  $("#cmenu").hidden = false;
  $("#cpick").classList.add("open");
  $("#cpick").setAttribute("aria-expanded","true");
  const box = $("#q"); box.value = q = ""; renderList(); box.focus();
}
function closeCMenu(){
  $("#cmenu").hidden = true;
  $("#cpick").classList.remove("open");
  $("#cpick").setAttribute("aria-expanded","false");
}
const cMenuOpen = () => !$("#cmenu").hidden;

/* ---------- floating spectrum map ---------- */
function openChartWin(){
  const c = DATA.countries[sel]; if(!c) return;
  $("#fwName").textContent = c.name;
  $("#chartWin").hidden = false;
  renderChart(c);
}
function closeChartWin(){ $("#chartWin").hidden = true; }
const chartWinOpen = () => !$("#chartWin").hidden;
function renderFilters(){
  const host = $("#filters"); host.innerHTML="";
  TECHS.forEach(t=>{
    const b = el("button","fchip"+(fTech.has(t)?" on":""), t==="NR"?"5G NR":t==="LTE"?"4G LTE":t==="UMTS"?"3G UMTS":"2G GSM");
    b.onclick=()=>{ fTech.has(t)?fTech.delete(t):fTech.add(t); render(); };
    host.appendChild(b);
  });
  host.appendChild(el("span",null,"&nbsp;")).style.flex="0 0 14px";
  Object.entries(STATUS).forEach(([k,v])=>{
    const b = el("button","fchip"+(fStat.has(k)?" on":""), v.l);
    b.title = v.d;
    b.onclick=()=>{ fStat.has(k)?fStat.delete(k):fStat.add(k); render(); };
    host.appendChild(b);
  });
}
function render(){
  if(sel>=DATA.countries.length) sel=0;
  const c = DATA.countries[sel];
  document.querySelectorAll(".editonly").forEach(n=>n.hidden=!edit);
  $("#btnEdit").textContent = "Edit mode: "+(edit?"on":"off");
  $("#btnEdit").classList.toggle("on", edit);
  renderList(); renderFilters();
  if(!c){ $("#hName").textContent="No countries"; $("#chart").innerHTML=""; $("#ops").innerHTML=""; return; }

  $("#hFlag").textContent = c.flag||"🏳";
  $("#hName").textContent = c.name;
  const all = c.operators.flatMap(o=>o.al);
  const held = all.filter(a=>!isLive(a[4])).length;
  const bands = new Set(all.map(a=>bandLabel(a[0],a[1])));
  $("#hMeta").innerHTML = `
    <span>MCC <b>${esc(c.mcc||"—")}</b></span>

function bandOptions(tech, cur){
  cur = canonBand(cur);
  return Object.keys(BAND).filter(k=>{
    const b=BAND[k];
    if(tech==="NR")   return !!b.nr;
    if(tech==="LTE")  return !!b.ea && !b.nrOnly;
    if(tech==="UMTS") return b.ua!==null && b.ua!==undefined;
    if(tech==="GSM")  return ["B2","B3","B5","B8","B25"].includes(k);
    return true;
  }).map(k=>`<option value="${k}" ${k===cur?"selected":""}>${bandLabel(tech,k)} — ${BAND[k].nm} (${BAND[k].dl[0]}–${BAND[k].dl[1]} MHz)</option>`).join("");
}
function allocForm(a){
  const tech = a?.[0]||"LTE", band = a?.[1]||"B3";
  return `<div class="fr">
      <div class="f"><label for="f_tech">Technology</label><select id="f_tech">
        ${TECHS.map(t=>`<option value="${t}" ${t===tech?"selected":""}>${TECH_LABEL[t]}</option>`).join("")}</select></div>
      <div class="f"><label for="f_band">Band</label><select id="f_band">${bandOptions(tech,band)}</select></div>
    </div>

function wireAllocForm(){
  const t=$("#f_tech"), b=$("#f_band"), lo=$("#f_lo"), hi=$("#f_hi");
  t.onchange = ()=>{ b.innerHTML = bandOptions(t.value, b.value); preview(); };
  [b,lo,hi].forEach(n=>n.oninput = preview);
  b.onchange = ()=>{ const bd=BAND[b.value]; if(bd && !lo.value){ lo.value=bd.dl[0]; hi.value=bd.dl[1]; } preview(); };
  preview();
  function preview(){
    const tech=t.value, band=b.value, L=parseFloat(lo.value), H=parseFloat(hi.value);
    const bd=BAND[band]; const p=$("#prev");
    if(!bd || isNaN(L) || isNaN(H) || H<=L){ p.textContent="Enter a downlink block to see the derived channel numbers."; return; }
    let warn = (L<bd.dl[0]-0.001 || H>bd.dl[1]+0.001)
      ? `<br><span style="color:var(--warn)">Heads up: this block sits outside the ${band} band edges (${bd.dl[0]}–${bd.dl[1]} MHz).</span>` : "";
    const d=channels(tech,band,L,H,"dl"), u=bd.dup==="FDD"?channels(tech,band,L,H,"ul"):null;
    const ub=ulBlock(band,L,H);
    p.innerHTML = `Downlink ${L}–${H} MHz${d?` · ${d.label} ${d.lo}–${d.hi}${d.c!=null?` (centre ${d.c})`:""}`:""}`
      + (ub?`<br>Uplink ${ub[0]}–${ub[1]} MHz${u?` · ${u.label} ${u.lo}–${u.hi}${u.c!=null?` (centre ${u.c})`:""}`:""}`:"")
      + `<br>Bandwidth ${r1(H-L)} MHz · ${bd.dup}` + warn;
  }
}
function readAlloc(){
  const L=parseFloat($("#f_lo").value), H=parseFloat($("#f_hi").value);
  if(isNaN(L)||isNaN(H)||H<=L){ toast("Enter a valid block: the end frequency must be above the start."); return null; }
  const nt=$("#f_nt").value.trim();
  const row=[$("#f_tech").value,$("#f_band").value,r1(L),r1(H),$("#f_st").value];
  if(nt) row.push(nt);
  return row;
}

<script>
/* ============================================================
   AUTO-FILL: research a country and turn it into Atlas rows
   ============================================================ */
const AIKEY = KEY + "-apikey";
const getKey = () => { try{ return localStorage.getItem(AIKEY) || ""; }catch(e){ return ""; } };
const setKey = v => { try{ v ? localStorage.setItem(AIKEY,v) : localStorage.removeItem(AIKEY); }catch(e){} };

function bandVocab(){
  return Object.keys(BAND).map(k=>{
    const b = BAND[k];
    const nm = b.nrOnly ? k : (b.nr ? `${k}/${b.nr}` : k);
    return `${nm} ${b.dl[0]}-${b.dl[1]} ${b.dup}`;
  }).join("; ");
}

function lookupPrompt(name){
  return `Research the mobile network operators of ${name} and return their spectrum holdings as JSON.

Search the web for the national regulator's spectrum register, recent auction results, and operator technical documentation. Prefer regulator and auction sources over consumer band-checker sites.

Return ONLY a JSON object, no prose, no markdown fences, in exactly this shape:

{"name":"${name}","flag":"<flag emoji>","iso3":"<ISO 3166-1 alpha-3>","mcc":"<mobile country code>",
 "note":"<one or two sentences on the market: how many networks, notable sharing deals, 2G/3G switch-off status>",
 "operators":[
   {"n":"<operator brand name>","mnc":"<MCC-MNC, e.g. 425-02>","note":"<one short sentence, or empty string>",
    "al":[["<tech>","<band>",<blockStartMHz>,<blockEndMHz>,"<status>","<short note or omit>"]]}
 ]}

Rules for the "al" rows:
- tech is exactly one of: GSM, UMTS, LTE, NR.
- band is exactly one of these identifiers (downlink edges and duplex mode shown for reference):
  ${bandVocab()}
  For NR use the n-name (n78, n28, n1 …); for LTE/UMTS/GSM use the B-name.
- blockStart and blockEnd are that operator's own DOWNLINK block in MHz, not the whole band. For TDD and supplementary-downlink bands give the single block. Never give uplink figures — the uplink is derived from the band's duplex spacing.
- status is exactly one of:
    "active"   carriers on air today
    "refarm"   on air but being converted to a newer technology
    "licensed" the operator holds this spectrum but has nothing on air in it
    "planned"  awarded or announced, launch still pending
    "sunset"   still on air but scheduled for switch-off
    "retired"  already switched off, or the licence was surrendered
- Include spectrum that is held but NOT in use, and spectrum that has been switched off. That distinction is the point of this database, so do not silently drop idle or retired holdings.
- One row per contiguous block per technology. If two technologies share a block (DSS, or LTE being refarmed to NR), give one row for each.
- Cover every MNO with its own radio network. Skip pure MVNOs, but mention them in "note".
- Where a source only gives a total holding rather than exact block edges, place the block plausibly inside the band and say so in the row note.

Output the JSON object and nothing else.`;
}

async function callClaude(prompt){
  const key = getKey();
  const headers = {"Content-Type":"application/json"};
  if(key){
    headers["x-api-key"] = key;
    headers["anthropic-version"] = "2023-06-01";
    headers["anthropic-dangerous-direct-browser-access"] = "true";
  }
  const res = await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST", headers,
    body: JSON.stringify({
      model:"claude-sonnet-4-6",
      max_tokens: 8000,
      messages:[{role:"user", content: prompt}],
      tools:[{type:"web_search_20250305", name:"web_search"}]
    })
  });
  if(!res.ok){
    const body = await res.text().catch(()=> "");
    throw new Error(`The API returned ${res.status}. ${body.slice(0,240)}`);
  }
  const data = await res.json();
  const text = (data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n").trim();
  if(!text) throw new Error("The model replied without any text — try again.");
  if(data.stop_reason === "max_tokens") throw new Error("The answer was cut off before the JSON finished. Try a country with fewer operators, or use the copy-the-prompt route.");
  return text;
}

function parseCountryJSON(txt){
  let t = String(txt).trim().replace(/^```(?:json)?/i,"").replace(/```$/,"").trim();
  const i = t.indexOf("{"), j = t.lastIndexOf("}");
  if(i<0 || j<=i) throw new Error("No JSON object found in that text.");
  return JSON.parse(t.slice(i, j+1));
}

const TECH_ALIAS = {"2G":"GSM","3G":"UMTS","4G":"LTE","5G":"NR","LTE-A":"LTE","WCDMA":"UMTS","HSPA":"UMTS","5GNR":"NR"};

function sanitizeCountry(raw){
  const warn = [];
  if(!raw || typeof raw!=="object") throw new Error("That isn't a country object.");
  const c = {
    id: String(raw.iso3||raw.id||"").toUpperCase().slice(0,2),
    name: String(raw.name||"").trim(),
    flag: String(raw.flag||"🏳").trim(),
    iso3: String(raw.iso3||"").toUpperCase().slice(0,3),
    mcc: String(raw.mcc||"").trim(),
    note: String(raw.note||"").trim(),
    operators: []
  };
  if(!c.name) throw new Error("The result has no country name.");
  const ops = Array.isArray(raw.operators) ? raw.operators : [];
  ops.forEach(o=>{
    const name = String(o?.n || o?.name || "").trim();
    if(!name){ warn.push("Skipped an operator with no name."); return; }
    const al = [];
    (Array.isArray(o.al)? o.al : []).forEach(row=>{
      if(!Array.isArray(row) || row.length<4){ warn.push(`${name}: skipped a malformed row.`); return; }
      let [t,bd,lo,hi,st,nt] = row;
      t = TECH_ALIAS[String(t).toUpperCase()] || String(t).toUpperCase();
      if(!TECHS.includes(t)){ warn.push(`${name}: unknown technology "${row[0]}".`); return; }
      const band = canonBand(String(bd).trim());
      const B = BAND[band];
      if(!B){ warn.push(`${name}: band "${bd}" isn't in the band table — row dropped.`); return; }
      lo = parseFloat(lo); hi = parseFloat(hi);
      if(isNaN(lo)||isNaN(hi)){ warn.push(`${name}: ${bd} had no usable frequencies.`); return; }
      if(hi < lo) [lo,hi] = [hi,lo];
      // an uplink block was given by mistake — shift it up to the downlink
      if(B.dup==="FDD" && hi <= B.ul[1]+0.01 && lo >= B.ul[0]-0.01 && lo < B.dl[0]){
        const g = B.dl[0]-B.ul[0]; lo += g; hi += g;
        warn.push(`${name}: ${bd} looked like an uplink block, moved to the matching downlink.`);
      }
      const cl = [Math.max(lo,B.dl[0]), Math.min(hi,B.dl[1])];
      if(cl[1] - cl[0] <= 0){ warn.push(`${name}: ${bd} ${lo}–${hi} MHz falls outside the band — row dropped.`); return; }
      if(Math.abs(cl[0]-lo)>0.01 || Math.abs(cl[1]-hi)>0.01) warn.push(`${name}: ${bd} ${lo}–${hi} MHz clipped to the band edges.`);
      st = String(st||"active").toLowerCase();
      if(!STATUS[st]){ warn.push(`${name}: unknown status "${row[4]}", treated as in service.`); st = "active"; }
      const out = [t, band, r1(cl[0]), r1(cl[1]), st];
      if(nt) out.push(String(nt).trim());
      al.push(out);
    });
    if(!al.length) warn.push(`${name}: no usable spectrum rows.`);
    c.operators.push({n:name, mnc:String(o.mnc||"").trim(), note:String(o.note||"").trim(), al});
  });
  if(!c.operators.length) throw new Error("The result contained no operators.");
  return {country:c, warn};
}

/* ---------- the lookup dialog ---------- */
function openLookup(ci){
  const target = DATA.countries[ci];
  const nm = target.name;
  let found = null;

  openModal(`Look up ${nm}`, `
    <p class="hint" style="margin-bottom:12px">Claude will search the web for ${esc(nm)}'s regulator records, auction
      results and operator documentation, then return operators and spectrum blocks in this page's own format.
      Nothing is written until you review it.</p>
    <div id="lkKeyBox" hidden style="margin-bottom:12px">
      <div class="f"><label for="lkKey">Anthropic API key</label>
        <input id="lkKey" type="text" placeholder="sk-ant-…" value="${esc(getKey())}"></div>
      <div class="hint">Required in the Android app and when this page runs from your own disk. It is stored on
        this device only and goes straight to api.anthropic.com. Leave it blank inside claude.ai.</div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn p" id="lkGo">Search and fill in</button>
      <button class="btn" id="lkKeyToggle">API key</button>
      <button class="btn" id="lkCopy">Copy the prompt instead</button>
    </div>
    <div id="lkStatus" class="hint" style="margin-top:12px"></div>
    <div id="lkOut" style="margin-top:12px"></div>
    <div style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px">
      <div class="f"><label for="lkJson">…or paste a JSON result you got elsewhere</label>
        <textarea id="lkJson" rows="4" placeholder='{"name":"…","operators":[…]}'
          style="font-family:ui-monospace,monospace;font-size:12px"></textarea></div>
      <button class="btn sm" id="lkUse" style="margin-top:8px">Use this text</button>
    </div>`, null);

  const S = m => { $("#lkStatus").innerHTML = m; };
  const inApp = !!(window.Bridge && Bridge.isApp);
  if(inApp && !getKey()) $("#lkKeyBox").hidden = false;

  $("#lkKeyToggle").onclick = ()=>{ const b=$("#lkKeyBox"); b.hidden=!b.hidden; if(!b.hidden) $("#lkKey").focus(); };
  $("#lkCopy").onclick = async ()=>{
    try{ await navigator.clipboard.writeText(lookupPrompt(nm)); S("Prompt copied. Paste it into any Claude chat with web search on, then bring the JSON back into the box below."); }
    catch(e){ $("#lkJson").value = lookupPrompt(nm); S("Clipboard is blocked here — the prompt is in the box below instead. Copy it out, then paste the answer back over it."); }
  };
  $("#lkUse").onclick = ()=>{
    try{ show(sanitizeCountry(parseCountryJSON($("#lkJson").value))); S(""); }
    catch(e){ S(`<span style="color:var(--sunset)">${esc(e.message)}</span>`); }
  };
  $("#lkGo").onclick = async ()=>{
    const k = $("#lkKey"); if(k) setKey(k.value.trim());
    $("#lkGo").disabled = true; $("#lkOut").innerHTML = "";
    S(`Searching for ${esc(nm)} — regulator records and auction results usually take 30 to 60 seconds.`);
    try{
      const txt = await callClaude(lookupPrompt(nm));
      show(sanitizeCountry(parseCountryJSON(txt)));
      S("");
    }catch(e){
      const net = (e instanceof TypeError) || /failed to fetch|networkerror|load failed/i.test(e.message||"");
      S(`<span style="color:var(--sunset)">${esc(net ? "The browser couldn't reach api.anthropic.com." : e.message)}</span><br>`
        + (inApp
          ? `Check that the phone is online and that an API key is set above — the app always needs its own key.
             Otherwise use <b>Copy the prompt instead</b>: paste it into any Claude chat with web search on and
             bring the JSON back to the box below.`
          : net
          ? `That is expected when this page is opened straight from a file on your disk — browsers block cross-site
             calls from <code>file://</code> pages whatever key you use. Two ways round it: serve the page over http
             (<code>python3 -m http.server</code> in its folder) and add an API key above, or use
             <b>Copy the prompt instead</b> — paste it into any Claude chat with web search on and bring the JSON
             back to the box below.`
          : `Check the API key above, or use <b>Copy the prompt instead</b>.`));
    }
    $("#lkGo").disabled = false;
  };

  function show({country, warn}){
    found = country;
    const blocks = country.operators.reduce((s,o)=>s+o.al.length,0);
    $("#lkOut").innerHTML = `
      <div style="border:1px solid var(--line2);border-radius:10px;padding:12px">
        <div style="font-family:var(--disp);font-weight:600;margin-bottom:8px">
          ${esc(country.flag)} ${esc(country.name)} — ${country.operators.length} operators, ${blocks} blocks</div>
        <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:10px">
          ${country.operators.map((o,i)=>`
            <label style="display:flex;gap:8px;align-items:baseline;font-size:13px">
              <input type="checkbox" class="lkOp" data-i="${i}" checked style="width:auto">
              <span><b>${esc(o.n)}</b> <span class="chsub">${esc(o.mnc||"")}</span><br>
                <span class="chsub">${o.al.length} blocks · ${[...new Set(o.al.map(a=>a[0]))].join(" · ")} ·
                ${o.al.filter(a=>!isLive(a[4])).length} not on air</span></span></label>`).join("")}
        </div>
        <div class="f" style="margin-bottom:10px"><label>How to apply it</label>
          <select id="lkMode">
            <option value="merge">Add operators I don't already have</option>
            <option value="replace">Replace every operator in ${esc(nm)}</option>
          </select></div>
        <label style="display:flex;gap:8px;font-size:13px;margin-bottom:10px">
          <input type="checkbox" id="lkMeta" checked style="width:auto">
          <span>Also take the flag, ISO code, MCC and market note</span></label>
        <button class="btn p" id="lkApply">Import into ${esc(nm)}</button>
      </div>
      ${warn.length? `<details style="margin-top:10px"><summary class="hint" style="cursor:pointer">
          ${warn.length} thing${warn.length>1?"s":""} the importer had to adjust</summary>
          <ul class="hint" style="margin:6px 0 0;padding-left:18px">${warn.map(w=>`<li>${esc(w)}</li>`).join("")}</ul>
        </details>` : ""}`;
    $("#lkApply").onclick = ()=>{
      const keep = [...document.querySelectorAll(".lkOp")].filter(x=>x.checked).map(x=>found.operators[+x.dataset.i]);
      if(!keep.length){ toast("Tick at least one operator first."); return; }
      const mode = $("#lkMode").value;
      if($("#lkMeta").checked){
        if(found.flag) target.flag = found.flag;
        if(found.iso3) target.iso3 = found.iso3;
        if(found.mcc)  target.mcc  = found.mcc;
        if(found.note) target.note = found.note;
      }
      let added = 0, skipped = 0;
      if(mode==="replace"){ target.operators = keep.map(o=>JSON.parse(JSON.stringify(o))); added = keep.length; }
      else keep.forEach(o=>{
        if(target.operators.some(x=>x.n.toLowerCase()===o.n.toLowerCase())) skipped++;
        else { target.operators.push(JSON.parse(JSON.stringify(o))); added++; }
      });
      sel = ci; save(); closeModal(); render();
      toast(`${added} operator${added===1?"":"s"} imported${skipped?`, ${skipped} already here`:""}. Check the blocks before you rely on them.`);
    };
  }
}

</script>
</body>
</html>
